<address>
  <!--suppress HtmlUnknownTarget, HtmlUnknownAttribute -->
  <a href="{% if include.link %}{{ include.link }}{% else %}#contact{% endif %}" {% if include.link %} target="_blank" {% endif %}>
    {% if include.emoji %}
      <span class="emoji" aria-hidden="true">{{ include.emoji }} </span>
    {% else %}
      <span class="emoji" aria-hidden="true">　&nbsp;</span>
    {% endif %}
    {{ include.name }}
  </a>
</address>
